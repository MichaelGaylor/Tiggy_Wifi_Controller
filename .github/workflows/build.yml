name: Build

on:
  push:
    branches: [main, dev]      # dev: build and test only; nothing is published from it
  pull_request:
    branches: [main]

jobs:
  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32s3-devkitc
            label: "Tiggy Pro board (DevKitC Octal N16R8)"
          - board: esp32s3-devkitc-quad
            label: "Tiggy Pro board (DevKitC Quad N8/N8R2)"
          - board: esp32s3-zero
            label: "Tiggy Standard board (S3-Zero)"
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ matrix.board }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.board }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware
        run: cd firmware && pio run -e ${{ matrix.board }}

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/.pio/build/${{ matrix.board }}/firmware.bin
            firmware/.pio/build/${{ matrix.board }}/bootloader.bin
            firmware/.pio/build/${{ matrix.board }}/partitions.bin

  test-motion-code:
    name: Test the firmware's motion code (PC build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build for the PC and run the step timing unit test
        run: sh firmware/test/pc/build.sh

      - name: Protocol conformance and firmware self-tests
        run: |
          python tools/firmware_sim.py --quiet &
          sleep 3
          python tools/protocol_conformance.py --sim --motion 127.0.0.1
          python tools/firmware_selftest.py

  test-linuxcnc-driver:
    name: Test the LinuxCNC driver
    runs-on: ubuntu-latest
    container:
      image: debian:trixie          # Debian 13 has LinuxCNC 2.9 as a package; Ubuntu does not
      # LinuxCNC's realtime helper runs as root and expects root's full rights
      # (to share memory with the user's programs, lock memory, set priorities),
      # which an ordinary container withholds.
      options: --privileged
    steps:
      - name: Install LinuxCNC and the build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            linuxcnc-uspace linuxcnc-uspace-dev build-essential python3 sudo git ca-certificates procps

      - uses: actions/checkout@v4

      - name: An ordinary user (LinuxCNC refuses to run as root)
        run: |
          useradd -m tester
          echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
          chown -R tester "$GITHUB_WORKSPACE"

      - name: Driver against the firmware simulator
        run: |
          bash linuxcnc/test/ci_step.sh "Simulator build" sudo -u tester -H sh firmware/test/pc/build.sh
          bash linuxcnc/test/ci_step.sh "Driver build with gcc" sudo -u tester -H sh linuxcnc/test/build.sh
          bash linuxcnc/test/ci_step.sh "Driver against the simulator" sudo -u tester -H python3 tools/linuxcnc_driver_test.py -v --lenient

      - name: Driver inside LinuxCNC
        run: bash linuxcnc/test/ci_step.sh "Driver inside LinuxCNC" sudo -u tester -H bash linuxcnc/test/run_in_linuxcnc.sh

  build-linux:
    name: Package LinuxCNC installer

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Package LinuxCNC files
        run: |
          mkdir -p linuxcnc-package
          cp linuxcnc/tiggy.c linuxcnc-package/
          cp linuxcnc/tiggy_setup.py linuxcnc-package/
          cp linuxcnc/install.sh linuxcnc-package/
          cp linuxcnc/install.desktop linuxcnc-package/
          cp linuxcnc/README.md linuxcnc-package/
          cp protocol/wifi_cnc_protocol.h linuxcnc-package/
          chmod +x linuxcnc-package/install.sh
          chmod +x linuxcnc-package/install.desktop
          chmod +x linuxcnc-package/tiggy_setup.py

      - name: Upload LinuxCNC package
        uses: actions/upload-artifact@v4
        with:
          name: Tiggy-LinuxCNC
          path: linuxcnc-package/

  build-gui:
    name: Build Protocol Tester GUI (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .exe
        run: |
          cd tools
          pyinstaller --onefile --noconsole --name TiggyProtocolTester protocol_test_gui.py
        shell: bash

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: TiggyProtocolTester
          path: tools/dist/TiggyProtocolTester.exe

  update-flasher:
    name: Update web flasher binaries
    needs: [build-firmware, test-motion-code]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4

      - name: Copy firmware binaries to docs
        run: |
          mkdir -p docs/firmware
          for board in esp32s3-devkitc esp32s3-devkitc-quad esp32s3-zero; do
            if [ -d "firmware-$board" ]; then
              cp "firmware-$board/bootloader.bin" "docs/firmware/bootloader-$board.bin"
              cp "firmware-$board/partitions.bin" "docs/firmware/partitions-$board.bin"
              cp "firmware-$board/firmware.bin" "docs/firmware/firmware-$board.bin"
            fi
          done

      - name: Commit updated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/
          if git diff --cached --quiet; then
            echo "No firmware changes to commit"
          else
            git commit -m "Update web flasher firmware binaries [skip ci]"
            git push
          fi

  release:
    name: Create Release
    needs: [build-firmware, test-motion-code, build-linux, build-gui]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package releases
        run: |
          # LinuxCNC installer
          cd Tiggy-LinuxCNC && tar czf ../Tiggy-LinuxCNC.tar.gz . && cd ..

          # Firmware binaries (zip + individual bins for web flasher)
          for board in esp32s3-devkitc esp32s3-devkitc-quad esp32s3-zero; do
            if [ -d "firmware-$board" ]; then
              cd "firmware-$board" && zip -r "../firmware-$board.zip" . && cd ..
              # Flat bin files for esp-web-tools manifest
              cp "firmware-$board/bootloader.bin" "bootloader-$board.bin"
              cp "firmware-$board/partitions.bin" "partitions-$board.bin"
              cp "firmware-$board/firmware.bin" "firmware-$board.bin"
            fi
          done

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (${{ steps.sha.outputs.short }})"
          body: |
            Automated build from commit ${{ github.sha }}

            ## ESP32 Firmware (flash via USB)
            - **firmware-esp32s3-devkitc.zip** - 6-axis DevKitC-1 N16R8 (Octal, default)
            - **firmware-esp32s3-devkitc-quad.zip** - 6-axis DevKitC-1 N8/N8R2 (Quad)
            - **firmware-esp32s3-zero.zip** - 3-axis Waveshare S3-Zero

            ## LinuxCNC
            - **Tiggy-LinuxCNC.tar.gz** - LinuxCNC driver with its installer and set-up wizard

            ## Protocol Tester
            - **TiggyProtocolTester.exe** - Windows GUI for testing and configuring the controller

            ## Mach3 Plugin
            Download from [Tiggy Pro releases](https://github.com/MichaelGaylor/Tiggy_Wifi_Controller_Pro/releases/latest)
          files: |
            Tiggy-LinuxCNC.tar.gz
            firmware-esp32s3-devkitc.zip
            firmware-esp32s3-devkitc-quad.zip
            firmware-esp32s3-zero.zip
            bootloader-esp32s3-devkitc.bin
            partitions-esp32s3-devkitc.bin
            firmware-esp32s3-devkitc.bin
            bootloader-esp32s3-devkitc-quad.bin
            partitions-esp32s3-devkitc-quad.bin
            firmware-esp32s3-devkitc-quad.bin
            bootloader-esp32s3-zero.bin
            partitions-esp32s3-zero.bin
            firmware-esp32s3-zero.bin
            TiggyProtocolTester/TiggyProtocolTester.exe
          prerelease: false
          make_latest: true
